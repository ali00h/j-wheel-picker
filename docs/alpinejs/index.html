<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دموی Alpine.js انتخابگر تاریخ جلالی</title><meta name="description" content="اتصال x-model در Alpine.js به انتخابگر تاریخ شمسی، با انتخاب تکی و بازه."><link rel="canonical" href="https://ali00h.github.io/j-wheel-picker/alpinejs/"><meta name="robots" content="index,follow"><link rel="stylesheet" href="../../css/j-wheel-picker.css"><link rel="stylesheet" href="../style.css"><script src="../../js/j-wheel-picker.js" defer></script><script src="app.js" defer></script><script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script></head><body><main x-data="dateExample"><a href="../">بازگشت به صفحهٔ اصلی</a><header><h1>دموی Alpine.js</h1><p>مقدار انتخاب‌شده با رویدادهای ورودی بومی در x-model همگام می‌شود.</p></header><section><h2>انتخاب تاریخ</h2><label for="appointment">تاریخ دلخواه</label><input id="appointment" x-ref="appointment" x-model="date" readonly placeholder="سال / ماه / روز" aria-haspopup="dialog"><output x-text="date ? 'تاریخ انتخاب‌شده: '+date : 'هنوز تاریخی انتخاب نشده است.'" aria-live="polite"></output><button type="button" @click="date=''">پاک‌کردن تاریخ</button></section><section><h2>انتخاب بازه</h2><label for="from">از تاریخ</label><input id="from" x-ref="from" x-model="from" readonly placeholder="تاریخ شروع" aria-haspopup="dialog"><label for="to">تا تاریخ</label><input id="to" x-ref="to" x-model="to" readonly placeholder="تاریخ پایان" aria-haspopup="dialog"><output x-text="from && to ? from+' تا '+to : 'هر دو تاریخ را انتخاب کنید.'" aria-live="polite"></output><button type="button" @click="from='';to=''">پاک‌کردن بازه</button></section><nav><a href="../html/">HTML</a><a href="../react/">React</a><a href="../vue/">Vue</a></nav></main></body></html>
