<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دموی HTML انتخابگر تاریخ جلالی</title><meta name="description" content="نمونهٔ فارسی HTML و JavaScript برای انتخاب تاریخ جلالی، بازه و پاک‌کردن تاریخ."><link rel="canonical" href="https://ali00h.github.io/j-wheel-picker/html/"><meta name="robots" content="index,follow"><link rel="stylesheet" href="../../css/j-wheel-picker.css"><link rel="stylesheet" href="../style.css"><script src="../../js/j-wheel-picker.js" defer></script><script src="app.js" defer></script></head><body><main><a href="../">بازگشت به صفحهٔ اصلی</a><header><h1>دموی HTML و JavaScript</h1><p>نمونهٔ ساده و مستقل؛ تاریخ تکی یا بازه را انتخاب کنید.</p></header><section><h2>انتخاب تاریخ تکی</h2><label for="date">تاریخ مراجعه</label><input id="date" readonly placeholder="سال / ماه / روز" aria-haspopup="dialog"><output id="single-result" aria-live="polite">هنوز تاریخی انتخاب نشده است.</output></section><section><h2>انتخاب بازهٔ تاریخ</h2><label for="from">از تاریخ</label><input id="from" readonly placeholder="تاریخ شروع" aria-haspopup="dialog"><label for="to">تا تاریخ</label><input id="to" readonly placeholder="تاریخ پایان" aria-haspopup="dialog"><output id="range-result" aria-live="polite">هر دو تاریخ را انتخاب کنید.</output><button id="clear" type="button">پاک‌کردن بازه</button></section><nav><a href="../alpinejs/">Alpine.js</a><a href="../react/">React</a><a href="../vue/">Vue</a></nav></main></body></html>
